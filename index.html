<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#1b7a43" />
  <meta name="description" content="BuenAprovecho - Marketplace de segunda salida comercial a lotes agrícolas en Tarija, Bolivia. Conectamos oferta de baja rotación o sobreoferta con compradores directos." />
  
  <title>BuenAprovecho - Marketplace Agrícola Tarija</title>

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- App Header -->
  <header class="app-header" role="banner">
    <div class="header-inner">
      <a href="#inicio" class="brand-logo" onclick="App.navigate('inicio'); return false;" aria-label="BuenAprovecho Inicio">
        <div class="logo-symbol" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Buen<span>Aprovecho</span></span>
          <span class="brand-tagline">Aprovecha más. Desperdicia menos.</span>
        </div>
      </a>

      <!-- Desktop Navigation -->
      <nav class="desktop-nav" role="navigation" aria-label="Navegación principal escritorio">
        <!-- Buyer links -->
        <a href="#inicio" class="nav-link buyer-only" data-view="inicio" onclick="App.navigate('inicio'); return false;">Inicio</a>
        <a href="#explorar" class="nav-link" data-view="explorar" onclick="App.navigate('explorar'); return false;">Explorar Lotes</a>
        <a href="#guardados" class="nav-link buyer-only" data-view="guardados" onclick="App.navigate('guardados'); return false;">Guardados</a>
        
        <!-- Seller links -->
        <a href="#mis-lotes" class="nav-link seller-only" data-view="mis-lotes" onclick="App.navigate('mis-lotes'); return false;">Mis Lotes</a>
        <a href="#publicar" class="nav-link seller-only" data-view="publicar" onclick="App.navigate('publicar'); return false;">+ Publicar Lote</a>
        
        <!-- Shared links -->
        <a href="#actividad" class="nav-link" data-view="actividad" onclick="App.navigate('actividad'); return false;">Tu Actividad</a>
        <a href="#perfil" class="nav-link" data-view="perfil" onclick="App.navigate('perfil'); return false;">Perfil</a>
      </nav>

      <!-- Header Actions: Alerts & Role Switcher -->
      <div class="header-actions">
        <button class="btn-header-alerts" title="Centro de Novedades y Avisos" aria-label="Novedades y avisos" onclick="App.openAlertsModal()">
          <span>🔔</span>
          <span id="alerts-count-badge" class="alerts-count-badge" style="display:none;">0</span>
        </button>

        <button id="header-role-badge" class="role-badge role-buyer" title="Clic para alternar entre Comprador y Vendedor" onclick="App.toggleUserRole()">
          Modo Comprador
        </button>
      </div>
    </div>
  </header>

  <!-- Main Application Content Views -->
  <main id="app-content" class="app-main" role="main">
    
    <!-- View: Inicio (Buyer Home) -->
    <section id="view-inicio" class="app-view active" aria-label="Pantalla de Inicio"></section>

    <!-- View: Explorar (Marketplace Grid & Filters) -->
    <section id="view-explorar" class="app-view" aria-label="Explorar Lotes Disponibles"></section>

    <!-- View: Guardados (Favorites) -->
    <section id="view-guardados" class="app-view" aria-label="Lotes Guardados en Favoritos"></section>

    <!-- View: Tu Actividad (Buyer & Seller Dashboards) -->
    <section id="view-actividad" class="app-view" aria-label="Métricas y Actividad"></section>

    <!-- View: Perfil & Laboratorio -->
    <section id="view-perfil" class="app-view" aria-label="Perfil y Configuración"></section>

    <!-- View: Mis Lotes (Seller Management) -->
    <section id="view-mis-lotes" class="app-view" aria-label="Gestión de Lotes Publicados"></section>

    <!-- View: Publicar Lote -->
    <section id="view-publicar" class="app-view" aria-label="Publicar Nuevo Lote"></section>

  </main>

  <!-- Bottom Navigation (Mobile-First) -->
  <nav class="bottom-nav" role="navigation" aria-label="Navegación inferior móvil">
    <!-- Buyer items -->
    <button class="bottom-nav-item buyer-only active" data-view="inicio" onclick="App.navigate('inicio')" aria-label="Inicio">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Inicio</span>
    </button>

    <button class="bottom-nav-item" data-view="explorar" onclick="App.navigate('explorar')" aria-label="Explorar">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Explorar</span>
    </button>

    <!-- Seller item: Mis Lotes -->
    <button class="bottom-nav-item seller-only" data-view="mis-lotes" onclick="App.navigate('mis-lotes')" aria-label="Mis Lotes">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
      </svg>
      <span>Mis Lotes</span>
    </button>

    <!-- Seller item: Publicar -->
    <button class="bottom-nav-item seller-only" data-view="publicar" onclick="App.navigate('publicar')" aria-label="Publicar">
      <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="16"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
      <span>Publicar</span>
    </button>

    <!-- Buyer item: Guardados -->
    <button class="bottom-nav-item buyer-only" data-view="guardados" onclick="App.navigate('guardados')" aria-label="Guardados">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      <span>Guardados</span>
    </button>

    <!-- Shared item: Actividad -->
    <button class="bottom-nav-item" data-view="actividad" onclick="App.navigate('actividad')" aria-label="Actividad">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span>Actividad</span>
    </button>

    <!-- Shared item: Perfil -->
    <button class="bottom-nav-item" data-view="perfil" onclick="App.navigate('perfil')" aria-label="Perfil">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Perfil</span>
    </button>
  </nav>

  <!-- Modals Container -->
  <!-- Modal: Detalle de Lote -->
  <div id="modal-lot-detail" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <div class="modal-window">
      <button class="modal-close-btn" aria-label="Cerrar ventana" onclick="App.closeModal('modal-lot-detail')">&times;</button>
      <div id="lot-detail-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Modal: Me Interesa (WhatsApp) -->
  <div id="modal-interest" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-window modal-window-sm">
      <button class="modal-close-btn" aria-label="Cerrar ventana" onclick="App.closeModal('modal-interest')">&times;</button>
      <div id="interest-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Modal: Marcar como Vendido -->
  <div id="modal-mark-sold" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-window modal-window-sm">
      <button class="modal-close-btn" aria-label="Cerrar ventana" onclick="App.closeModal('modal-mark-sold')">&times;</button>
      <div id="mark-sold-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Modal: Reportar Publicación -->
  <div id="modal-report" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-window modal-window-sm">
      <button class="modal-close-btn" aria-label="Cerrar ventana" onclick="App.closeModal('modal-report')">&times;</button>
      <div id="report-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Modal: Destacar Lote & Planes Validación -->
  <div id="modal-featured" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-window modal-window-sm">
      <button class="modal-close-btn" aria-label="Cerrar ventana" onclick="App.closeModal('modal-featured')">&times;</button>
      <div id="featured-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Modal: Centro de Novedades y Avisos -->
  <div id="modal-alerts" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-window modal-window-sm">
      <button class="modal-close-btn" aria-label="Cerrar ventana" onclick="App.closeModal('modal-alerts')">&times;</button>
      <div id="alerts-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Application Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
